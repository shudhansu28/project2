<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0; padding: 0; box-sizing: border-box;
        }
        
        .main{
    width: 500px; height: 450px; border: 10px solid #000;
    position: relative; margin: 400px;
}
.item{
    width: 70px; height: 70px; border: 2px solid red;
    position: absolute; background: white; }
    .a{
    left: 40%; top: -40px;  
}
.b{
    left: 40%; bottom: -40px;
}
.c{
    top: 40%; left: -40px;
}
.d{
    top: 40%; right: -40px;
}
    </style>
</head>
<body>
        <div class="main">
            <div class="item a ">A</div>
            <div class="item b">B</div>
            <div class="item c">C</div>
            <div class="item d">D</div>
        </div>
    
</body>
</html>
