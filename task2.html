<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0px; padding: 0px; box-sizing: border-box;}
        .main{width: 500px; height: 350px; border: 10px solid #000; margin: 500px 500px; position: relative;}
        .item{border: 5px solid red; width: 70px; height: 70px; position: absolute;}
        .a{top: -40px; left: 200px; background: white;} .b{right: -40px; bottom: 150px;background: white;} .c{bottom: -40px;left: 200px;background: white;} .d{left: -40px;bottom: 150px;background: white;}
    </style>
</head>
<body>
    <div class="main">
        <div class="item a">A</div>
        <div class="item b">B</div>
        <div class="item c">C</div>
        <div class="item d">D</div>
    </div>
</body>
</html>
