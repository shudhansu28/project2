<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="get">
        <fieldset>
            <legend>HTML Form</legend>
            <label for="f_name">First Name:</label>
            <input type="text" name="f_name" id="f_name">
            <hr>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="0" max="100">
            <hr>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <hr>
            <label for="password">Password:</label>
            <input type="password" id="password" name="pass">
            <hr>
            Enter Gender: <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
            <hr>
            Enter Courses: <input type="checkbox" name="courses" value="php">PHP
            <input type="checkbox" name="courses" value="java"> Java
            <input type="checkbox" name="courses" value="mern"> Mern
            <hr>
            color: <input type="color" name="color">
            <hr>
            date: <input type="date" name="date">
            <hr>
            Time: <input type="time" name="time">
            <hr>
            date & Time: <input type="datetime-local" name="dt">
            <hr>
            Week: <input type="week" name="week">
            <hr>
            Month: <input type="month" name="month">
            <hr>
            Country: <select name="Country">
                <option value="ne">Nepal</option>
                <option value="in">India</option>
                <option value="bu">Bhutan</option>
            </select>
            <hr>
            <input type="range" name="price" max="100">
            <hr>
            Domain: <input type="url" name="dd" >
            <hr>
            Message: <textarea name="mss" rows="10" cols="10"></textarea>
            <hr>
            <button>Send</button>
        </fieldset>
    </form>
</body>

</html>
