<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>HTML Form</legend>
            <label for="a">Enter First Name:</label>
            <input name="fname" id="a" type="text">
            <hr>
            <label for="b">Enter Last Name:</label>
            <input name="Lname" id="b" type="text">
            <hr>
            <label for="age">Enter Age:</label>
            <input name="age"  id="age" type="number" min="0" max="100" >
            <hr>
            Enter Gender:
            <label for="male">Male</label>
            <input name="gender" id="male" type="radio" value="m" >
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="f">
            <hr>
            <label for="country" >Enter Country:</label>
            
            <select name="country">
                <option value="np">Nepal</option>
                <option >India</option>
            </select>
            <hr>
            <button>Send</button>
        </fieldset>
    </form>
</body>
</html>
