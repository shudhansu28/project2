<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{width: 300px; height: 300px; background: pink; position: relative;}
        .a,.b{width: 30px;height: 30px; position: absolute;}
        .a{bottom: 0; right: 0; background: red; z-index: 2;}
        .b{bottom: 15px; right: 15px; background:green; z-index: 1;}
    </style>
</head>
<body>
    <div class="main">
        <div class="a"></div>
        <div class="b"></div>
    </div>
</body>
</html>
